name: Android · 3 prereleases

on:
  push:
    branches: [arena/e155af27-sonic-keyboard]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      diagnose_run:
        description: ID de una ejecución anterior para inspeccionar sus informes (no compila ni publica)
        type: string
        default: ""
      publish:
        description: Publicar los tres APK como prelanzamientos después de las pruebas
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: velocity-android-${{ github.ref }}-${{ inputs.diagnose_run || 'build' }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.diagnose_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: velocity-android-debug-key-${{ runner.os }}-v1
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Install browser for web interface tests
        run: npx playwright install --with-deps chromium
      - name: Web interface, release links and offline downloads
        run: TEST_OFFLINE=1 npm run test:e2e
      - name: Compile all three APKs, native unit tests and IME lint
        working-directory: android
        run: |
          chmod +x gradlew
          bash ../scripts/gradle-ci.sh assembleDebug testWebPreviewDebugUnitTest testPersonalPreviewDebugUnitTest testImePreviewDebugUnitTest lintImePreviewDebug --no-daemon -PvelocityBuildNumber="$GITHUB_RUN_NUMBER"
      - name: Free hosted runner disk for emulator userdata
        run: |
          # Emulator 37 checks the image's minimum userdata size even when a
          # smaller disk-size is requested. These preinstalled toolchains are
          # not used by this Java/Capacitor project; do not remove the SDK itself.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$ANDROID_HOME/ndk"
          df -h /
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Alpha 3 as an actual keyboard in a separate app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 180
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/test-android-ci.sh
      - name: Prepare APKs and checksums
        run: |
          for entry in '1 webPreview' '2 personalPreview' '3 imePreview'; do
            read -r stage flavor <<< "$entry"
            mkdir -p "apk/alpha-$stage"
            cp "android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk" "apk/alpha-$stage/velocity-android.apk"
            (cd "apk/alpha-$stage" && sha256sum velocity-android.apk > velocity-android.apk.sha256)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-three-android-previews
          path: apk/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Publish three GitHub prereleases
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-previews.sh "$GITHUB_SHA"

  diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_run != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-test-reports
          path: reports
          run-id: ${{ inputs.diagnose_run }}
          github-token: ${{ github.token }}
      - name: Summarize lint errors in check annotations
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('reports').rglob('*'):
              if path.is_file(): print(path)
              if path.suffix == '.xml' and 'lint' in path.name:
                  root = ET.parse(path).getroot()
                  for issue in root.findall('issue'):
                      if issue.get('severity') not in ['Error', 'Fatal']: continue
                      message = ET.tostring(issue, encoding='unicode')[:3500].replace('%','%25').replace('\n','%0A').replace('\r','%0D')
                      print('::error title=Lint report::' + message)
          PYTHON
      - name: Summarize failed runner logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.diagnose_run }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, re
          result = subprocess.run(['gh','run','view',os.environ['RUN_ID'],'--log'],capture_output=True,text=True)
          log = result.stdout + result.stderr

          lines = [line for line in log.splitlines() if re.search(r'error|warning|panic|fatal|KVM|emulator |emulator-|Boot|boot|GPU|qemu',line,re.I)]
          text = '\n'.join(line for line in lines if re.search(r'FATAL|PANIC|Exception|FAILED',line))[:3000] + '\n--- LOG TAIL ---\n' + log[-9000:]
          for start in range(0,len(text),3300):
              chunk=text[start:start+3300].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Runner diagnostics ' + str(start) + '::' + chunk)
          PYTHON
