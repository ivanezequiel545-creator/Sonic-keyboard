name: Android · 3 prereleases

on:
  push:
    branches: [arena/e155af27-sonic-keyboard]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar los tres APK como prelanzamientos después de las pruebas
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: velocity-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: velocity-android-debug-key-${{ runner.os }}-v1
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Install browser for web interface tests
        run: npx playwright install --with-deps chromium
      - name: Web interface, release links and offline downloads
        run: TEST_OFFLINE=1 npm run test:e2e
      - name: Compile all three APKs, native unit tests and IME lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testWebPreviewDebugUnitTest testPersonalPreviewDebugUnitTest testImePreviewDebugUnitTest lintImePreviewDebug --no-daemon -PvelocityBuildNumber="$GITHUB_RUN_NUMBER"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Alpha 3 as an actual keyboard in a separate app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: cd android && ./gradlew connectedImePreviewDebugAndroidTest --no-daemon -PvelocityBuildNumber="$GITHUB_RUN_NUMBER"
      - name: Prepare APKs and checksums
        run: |
          for entry in '1 webPreview' '2 personalPreview' '3 imePreview'; do
            read -r stage flavor <<< "$entry"
            mkdir -p "apk/alpha-$stage"
            cp "android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk" "apk/alpha-$stage/velocity-android.apk"
            (cd "apk/alpha-$stage" && sha256sum velocity-android.apk > velocity-android.apk.sha256)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-three-android-previews
          path: apk/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Publish three GitHub prereleases
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-previews.sh "$GITHUB_SHA"
